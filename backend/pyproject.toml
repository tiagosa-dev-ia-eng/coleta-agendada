[tool.ruff]
target-version = "py312"
line-length = 100
src = ["apps", "config"]
exclude = [".pylibs", ".venv", "*/migrations/*"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"*/migrations/*" = ["E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_tests.py", "tests.py"]
addopts = "-q"
