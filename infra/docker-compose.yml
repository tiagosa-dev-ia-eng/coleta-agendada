# Coleta Agendada — stack de desenvolvimento (doc 03/13, README do pacote).
# Banco e Redis sobem por padrão; backend+frontend via perfil "full".
# Uso:
#   docker compose -f infra/docker-compose.yml up -d db redis
#   docker compose -f infra/docker-compose.yml --profile full up -d --build
name: coleta-agendada

services:
  db:
    image: postgres:16-alpine
    container_name: ca-db
    environment:
      POSTGRES_USER: coleta
      POSTGRES_PASSWORD: coleta
      POSTGRES_DB: coleta
    ports:
      # 5432 do host já está ocupado por outro postgres local
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coleta -d coleta"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ca-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    profiles: ["full"]
    build:
      context: ..
      dockerfile: infra/docker/backend/Dockerfile
    container_name: ca-backend
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DJANGO_SECRET_KEY: dev-only-secret
      DJANGO_DEBUG: "true"
      DATABASE_URL: postgres://coleta:coleta@db:5432/coleta
      REDIS_URL: redis://redis:6379/0
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      # fontes externas montadas ao vivo (README do pacote)
      - ../backend:/app
      - mediaroot:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    profiles: ["full"]
    build:
      context: ..
      dockerfile: infra/docker/frontend/Dockerfile
    container_name: ca-frontend
    command: ["pnpm", "dev"]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ../frontend:/app
      # isola node_modules do container para não sobrescrever o do host
      - frontend_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
  mediaroot:
  frontend_modules:
